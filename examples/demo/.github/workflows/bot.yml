name: PR bot
on:
  issue_comment:
    types: [created]
  pull_request_target:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore model weights
        uses: actions/cache/restore@v4
        with:
          path: models
          key: models-${{ hashFiles('models.lock') }}
      - run: npm ci && npm run lint
